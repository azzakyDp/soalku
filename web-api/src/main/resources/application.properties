spring.application.name=soalku
soalku.latihan.seconds-per-question=${LATIHAN_SECONDS_PER_QUESTION:60}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
soalku.storage.root=${MATERIAL_STORAGE_ROOT:./data/materials}
soalku.gemini.api-key=${GEMINI_API_KEY:}
soalku.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
soalku.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/
soalku.gemini.timeout=${GEMINI_TIMEOUT:20s}
soalku.gemini.questions-per-section=${GEMINI_QUESTIONS_PER_SECTION:5}
spring.config.import=classpath:soalku-persistence.properties
logging.structured.format.console=logstash
# SQL exception messages can contain full material/question rows; application handlers log safe diagnostics.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

soalku.jwt.secret=${JWT_SECRET}
soalku.jwt.issuer=${JWT_ISSUER:soalku}
soalku.jwt.ttl=${JWT_TTL:15m}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true
