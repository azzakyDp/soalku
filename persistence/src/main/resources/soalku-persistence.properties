# Spring Boot binds these settings through its standard @ConfigurationProperties.
# No credential defaults: deployment must supply environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=soalku
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.postgresql.transactional-lock=false
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=soalku
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
